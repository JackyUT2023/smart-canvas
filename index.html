v><div id="dateActions"><button type="button" id="newEvent">＋ 新增事項</button> <button type="button" id="newDateMarker">＋ 新增日期標記</button> <button type="button" id="close">關閉</button></div></dialog><dialog id="widgetActionsDialog"><h3 id="widgetActionsTitle">管理模組</h3><p class="muted">選擇要執行的操作</p><div><button type="button" id="widgetEdit">修改名稱</button> <button type="button" id="widgetDelete">刪除模組</button> <button type="button" id="widgetCancel">取消</button></div></dialog><dialog id="widgetEditDialog"><h3>修改模組名稱</h3><form id="widgetEditForm"><label>名稱<input id="widgetEditTitle" maxlength="45" required></label><div><button type="submit">儲存修改</button> <button type="button" id="widgetEditCancel">取消</button></div></form></dialog><dialog id="memberActionsDialog"><h3 id="memberActionsTitle">家庭成員</h3><p class="muted">選擇要執行的操作</p><div><button type="button" id="actionEditMember">編輯成員</button> <button type="button" id="actionDeleteMember">刪除成員</button> <button type="button" id="actionCloseMember">取消</button></div></dialog><dialog id="memberDialog"><h3>編輯家庭成員</h3><form id="memberForm"><label>成員名稱<input id="editMemberName" required maxlength="40"></label><label>成員顏色<input id="editMemberColor" type="color" required></label><div><button type="submit">儲存修改</button> <button type="button" id="cancelMember">取消</button></div></form></dialog><dialog id="eventDialog"><h3 id="eventEditorTitle">新增事項</h3><form id="eventForm"><label>事項名稱<input id="title" required placeholder="例如：打羽毛球"></label><label>開始時間<input type="time" id="start" required value="10:30"></label><label>結束時間<input type="time" id="end" required value="12:30"></label><label>參與成員<select id="person"></select></label><label>備註<input id="notes"></label><div><button type="submit">儲存事項</button> <button type="button" id="cancelEvent">取消</button></div></form></dialog><dialog id="markerDialog"><h3>新增日期標記</h3><form id="markerForm"><label>標記名稱<input id="markerTitle" required placeholder="例如：Pizza Lunch"></label><label>圖示<select id="markerIcon" const $=id=>document.getElementById(id),colors=['#4589e9','#e5a332','#e7669b','#39a984','#9b76df','#ef8a44'];let state,selected=null,selectedWidgetId=null,preview=false,drag=null,activeDate='',view='month',offset=0,editingEvent=null;const defaults=()=>({members:[{id:1,name:'我',color:colors[0]},{id:2,name:'爸爸',color:colors[1]}],events:[],markers:[],widgets:[{id:1,type:'calendar',x:2,y:3,w:96,h:91},{id:2,type:'note',x:2,y:80,w:45,h:18,text:'家庭留言\nHave a great day!'},{id:3,type:'todo',x:51,y:80,w:45,h:18,text:'☐ 買牛奶\n☐ 整理房間'}]});try{state=JSON.parse(localStorage.getItem('sc-v01'))||defaults()}catch{state=defaults()}if(!Array.isArray(state.events))state.events=[];if(!Array.isArray(state.markers))state.markers=[];function persist(){try{localStorage.setItem('sc-v01',JSON.stringify(state));$('status').textContent='✓ 已儲存喺呢部裝置'}catch{$('status').textContent='此瀏覽器無法儲存'}}function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n),person=e=>state.members.find(m=>String(m.id)===String(e.person))||{name:'未分類',color:'#888'},eventsOn=k=>state.events.filter(e=>e.date===k).sort((a,b)=>a.start.localeCompare(b.start)),chip=e=>{let p=person(e);return `<div class="chip" style="background:${p.color}22;border-color:${p.color}" title="${safe(p.name)} ${safe(e.start)}–${safe(e.end)} ${safe(e.title)}"><b>${safe(e.start)}–${safe(e.end)}</b><div>${safe(p.name)} · ${safe(e.title)}</div></div>`};function renderMembers(){$('members').innerHTML=Array.from({length:6},(_,i)=>{let m=state.members[i];return m?`<div class="member-row" data-member-id="${m.id}" role="button" tabindex="0" aria-label="管理 ${safe(m.name)}"><span class="member-name"><span style="color:${m.color}">●</span> ${safe(m.name)}</span><span class="member-arrow">›</span></div>`:`<p style="margin:5px 0;color:#9ca3af">○ 成員 ${i+1}（未設定）</p>`}).join('');$('person').innerHTML=state.members.map(m=>`<option value="${m.id}">${safe(m.name)}</option>`).join('')}

function dateDiff(a,b){const toDay=k=>{let [y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000};return toDay(a)-toDay(b)}
function markersOn(k){return state.markers.filter(m=>{let diff=dateDiff(k,m.start);return diff>=0&&(Number(m.repeat)===0?diff===0:diff%Number(m.repeat)===0)})}
function miniDay(k){let slots=Array.from({length:6},(_,i)=>state.members[i]||null),min=7*60,max=22*60,span=max-min;return `<div class="mini-tracks" title="頂部 07:00 · 底部 22:00；點擊查看詳情">${slots.map(m=>{let ev=m?eventsOn(k).filter(e=>String(e.person)===String(m.id)):[];return `<div class="mini-track" title="${m?safe(m.name):'空成員欄'}">${ev.map(e=>{let a=e.start.split(':').map(Number),b=e.end.split(':').map(Number),start=a[0]*60+a[1],end=b[0]*60+b[1],top=Math.max(0,Math.min(span,start-min)),bottom=Math.max(0,Math.min(span,end-min));if(bottom<=top)return '';return `<span class="mini-bar" style="top:${top/span*100}%;height:${Math.max(.8,(bottom-top)/span*100)}%;background:${m.color}" title="${safe(m.name)} ${safe(e.start)}–${safe(e.end)} ${safe(e.title)}"></span>`}).join('')}</div>`}).join('')}</div>`}
function markerBadges(k){let items=markersOn(k);return items.length?`<div class="day-markers">${items.map(m=>`<span class="date-marker" title="${safe(m.title)}">${safe(m.icon)} ${safe(m.title)}</span>`).join('')}</div>`:''}
function memberLegend(){return `<div class="member-legend">${Array.from({length:6},(_,i)=>{let m=state.members[i];return `<span class="legend-item"><span class="legend-dot" style="background:${m?m.color:'#d0d7e3'}"></span>${m?safe(m.name):'成員 '+(i+1)}</span>`}).join('')}</div>`}
function weekHTML(){let today=new Date(),base=addDays(today,-today.getDay()+offset*7),unit=52,start=7,end=22,total=(end-start)*unit;let ticks=Array.from({length:end-start+1},(_,i)=>`<div class="wk-tick" style="top:${i*unit}px"><span>${String(start+i).padStart(2,'0')}:00</span></div>`).join('');let days=Array.from({length:7},(_,i)=>{let day=addDays(base,i),k=key(day),es=eventsOn(k),labels=markersOn(k);return `<div class="wk-day" data-date="${k}"><div class="wk-dayhead" data-date="${k}"><b>${['日','一','二','三','四','五','六'][i]} ${day.getMonth()+1}/${day.getDate()}</b><div>${labels.map(m=>`<span title="${safe(m.title)}">${safe(m.icon)}</span>`).join('')}</div></div><div class="wk-lanes" style="height:${total}px">${Array.from({length:6},(_,j)=>{let m=state.members[j];return `<div class="wk-lane" title="${m?safe(m.name):'空成員欄'}">${m?es.filter(e=>String(e.person)===String(m.id)).map(e=>{let [sh,sm]=e.start.split(':').map(Number),[eh,em]=e.end.split(':').map(Number),a=Math.max(0,Math.min(total,(sh+sm/60-start)*unit)),b=Math.max(0,Math.min(total,(eh+em/60-start)*unit));if(b<=a)return '';return `<div class="wk-event" data-date="${k}" title="${safe(m.name)} · ${safe(e.start)}–${safe(e.end)} · ${safe(e.title)}" style="top:${a}px;height:${Math.max(2,b-a)}px;background:${m.color}28;border-left:3px solid ${m.color}"><b>${safe(e.title)}</b><span>${safe(e.start)}–${safe(e.end)}</span></div>`}).join(''):''}</div>`}).join('')}</div></div>`}).join('');return `<div class="calendarhead"><b>📅 ${base.getFullYear()}年${base.getMonth()+1}月${base.getDate()}日 — ${addDays(base,6).getMonth()+1}月${addDays(base,6).getDate()}日</b><div><button data-nav="-1">‹ 上週</button><button data-nav="0">本週</button><button data-nav="1">下週 ›</button><button data-view="month">月曆</button><button class="active" data-view="week">週曆</button><button data-view="timeline">日曆</button></div></div>${memberLegend()}<div class="wk-hint">左邊時間刻度 · 每日六條彩色成員軌道 · 點擊行程可查看詳情</div><div class="wk-scroll"><div class="wk-layout"><div class="wk-axis" style="height:${total+37}px"><div class="wk-axis-spacer"></div><div class="wk-ticks" style="height:${total}px">${ticks}</div></div><div class="wk-days">${days}</div></div></div>`}
